apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: firecracker-agent
  namespace: kplane-sandbox-system
  labels:
    app: firecracker-agent
spec:
  selector:
    matchLabels:
      app: firecracker-agent
  template:
    metadata:
      labels:
        app: firecracker-agent
    spec:
      nodeSelector:
        kplane.dev/sandbox-runtime: firecracker
      tolerations:
      - key: kplane.dev/sandbox-runtime
        operator: Equal
        value: firecracker
        effect: NoSchedule
      hostPID: true
      containers:
      - name: agent
        image: ghcr.io/kplane-dev/firecracker-agent:latest
        args:
        - --listen=:8090
        - --firecracker-bin=/opt/firecracker/bin/firecracker
        - --kernel=/opt/firecracker/vmlinux
        - --image-dir=/opt/firecracker/images
        - --work-dir=/host/var/lib/firecracker-agent
        - --max-vms=10
        - --min-warm=2
        - --warm-images=python,node
        ports:
        - name: api
          containerPort: 8090
        securityContext:
          privileged: true
        volumeMounts:
        - name: host
          mountPath: /host
        - name: dev-kvm
          mountPath: /dev/kvm
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8090
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8090
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
      volumes:
      - name: host
        hostPath:
          path: /
      - name: dev-kvm
        hostPath:
          path: /dev/kvm
